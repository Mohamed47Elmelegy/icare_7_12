plugins {
    id "com.android.application"
    // id "kotlin-android"
    //(16KB memory page compatible)
    id 'org.jetbrains.kotlin.android'
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.icare.icare_app"
    compileSdk = 36
    // Updated to NDK r28 for 16 KB page size support.
    ndkVersion = "28.2.13676358"
    buildToolsVersion "36.0.0"

    packagingOptions {
        jniLibs {
            // Required for 16 KB memory page compatibility.
            useLegacyPackaging = false
        }
    }

     compileOptions {
        // Move project Java toolchain to Java 21 (16KB memory page compatible)
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }
     kotlinOptions {
         // Match Kotlin JVM target to Java 21 (16KB memory page compatible)
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.icare.icare_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        minSdk = 24
        targetSdk = 36
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.firebase:firebase-analytics'
    // implementation("com.google.firebase:firebase-analytics")
    // implementation 'com.google.firebase:firebase-crashlytics:18.3.2'
    // implementation 'com.google.firebase:firebase-messaging:23.1.0'
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
}